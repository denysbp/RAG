[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.13",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "langchain-text-splitters>=1.1.3",
    "mypy>=2.4.0",
    "numpy>=2.2.6",
    "pandas",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]


[tool.mypy]
exclude = [
    "^data/raw/",
    "treinos"
]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = ["data.*", "tests.*", "treinos.*"]
ignore_errors = true
