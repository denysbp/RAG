[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "pandas",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "tqdm>=4.70.1",
]


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
